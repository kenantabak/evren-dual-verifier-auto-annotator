[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-dual-verifier-auto-annotator"
version = "1.1.0"
description = "Dual-Architecture (YOLO26/YOLO11 Teacher + GroundingDINO VLM) consensus auto-annotation engine"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Kenan Tabak"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]
